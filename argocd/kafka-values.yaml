# Use the locally loaded Bitnami legacy image
image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10
  pullPolicy: IfNotPresent

# One node running both controller and broker
controller:
  replicaCount: 1
  controllerOnly: false

  persistence:
    enabled: false

# No separate broker-only nodes
broker:
  replicaCount: 0

# Plaintext communication for this local learning environment
listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

# TLS is not required for this local lab
tls:
  autoGenerated:
    enabled: false
