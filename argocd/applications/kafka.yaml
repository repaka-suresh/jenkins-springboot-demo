apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: kafka
      targetRevision: 32.4.3
      helm:
        valueFiles:
          - $values/argocd/kafka-values.yaml

    - repoURL: https://github.com/repaka-suresh/jenkins-springboot-demo.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
